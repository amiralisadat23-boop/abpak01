# =============================================================================
# آب پاک | ABPAK — استک اجرای پروژه (آماده استقرار)
#   web      : جنگو با gunicorn (پورت 8000 فقط روی loopback)
#   postgres : پایگاه داده اصلی (فقط loopback)
#   redis    : بروکر/بک‌اند سلری و کش مشترک (فقط loopback)
#   worker   : سلری ورکر برای تسک‌های پس‌زمینه
#   beat     : سلری بیت برای اجرای زمان‌بندی‌شده تسک‌ها
#
# استقرار:  cp .env.production.example .env  → مقادیر واقعی → docker compose up -d --build
# لاگ:      docker compose logs -f web worker beat
# تست:      docker compose exec web python manage.py test
#
# نکته TLS/پروکسی: این استک پورت 8000 را فقط روی 127.0.0.1 باز می‌کند؛ برای
# دامنه و HTTPS یک پروکسی معکوس روی هاست (nginx/caddy) یا Cloudflare بگذارید:
#   proxy_set_header X-Forwarded-Proto $scheme;  proxy_set_header Host $host;
# =============================================================================

# تنظیمات مشترک اپلیکیشن (وب، ورکر و بیت).
# آدرس‌های داخلی شبکه داکر با نام سرویس‌ها ست می‌شوند و بر .env اولویت دارند.
x-app-environment: &app-environment
  DATABASE_URL: postgres://${POSTGRES_USER:-abpak}:${POSTGRES_PASSWORD:-abpak}@postgres:5432/${POSTGRES_DB:-abpak}
  REDIS_URL: redis://redis:6379/0
  CACHE_BACKEND: django_redis.cache.RedisCache
  CACHE_LOCATION: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0

services:
  web:
    build: .
    image: abpak-web:latest
    container_name: abpak-web
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-environment
      RUN_SETUP: "1"
    volumes:
      - ./media:/app/media
    # فقط از روی خود سرور قابل دسترسی است؛ ترافیک عمومی از پروکسی می‌آید
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request as u; r = u.Request('http://127.0.0.1:8000/', headers={'Host': '127.0.0.1'}); u.urlopen(r, timeout=5).read()"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres:17-alpine
    container_name: abpak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abpak}
      POSTGRES_USER: ${POSTGRES_USER:-abpak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abpak}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # فقط برای اجرای manage.py روی هاست؛ از بیرون قابل دسترسی نیست
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abpak} -d ${POSTGRES_DB:-abpak}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: abpak-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    image: abpak-web:latest
    container_name: abpak-celery-worker
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    env_file: .env
    environment:
      <<: *app-environment
    volumes:
      - ./media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  beat:
    build: .
    image: abpak-web:latest
    container_name: abpak-celery-beat
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    env_file: .env
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

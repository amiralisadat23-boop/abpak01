{% comment %}تصویر برداری دستگاه تصفیه آب خانگی و لیوان آب{% endcomment %}

    <linearGradient id="dev-steel" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e6f0f8"/>
      <stop offset="1" stop-color="#c3d8e8"/>
    </linearGradient>
    <linearGradient id="dev-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fbfe"/>
      <stop offset="1" stop-color="#dceaf5"/>

    <linearGradient id="dev-housing" x1="0" y1="0" x2="1" y2="0">

      <stop offset="0.5" stop-color="#dcecf8"/>
      <stop offset="1" stop-color="#a9c9e0"/>
    </linearGradient>
    <linearGradient id="dev-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ee0fb" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#2b8fd6" stop-opacity="0.9"/>

    <linearGradient id="dev-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="dev-chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#dbe9f4"/>
      <stop offset="1" stop-color="#89a9c1"/>
    </linearGradient>
    <radialGradient id="dev-halo" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#48b3e8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#48b3e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

{% comment %}تصویر برداری فیلترها و کارتریج‌های تصفیه آب{% endcomment %}
<svg class="hero__illustration" viewBox="0 0 520 470" role="img" aria-label="فیلترها و کارتریج‌های تصفیه آب آب پاک">
  <defs>
    <linearGradient id="fl-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#eaf4fb"/>
      <stop offset="1" stop-color="#b9d5e8"/>
    </linearGradient>
    <linearGradient id="fl-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fc4ff"/>
      <stop offset="1" stop-color="#2f7ed8"/>
    </linearGradient>
    <linearGradient id="fl-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ee0fb"/>
      <stop offset="1" stop-color="#2b8fd6"/>
    </linearGradient>
    <radialGradient id="fl-halo" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#48b3e8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#48b3e8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="225" r="200" fill="url(#fl-halo)"/>
  <circle cx="256" cy="225" r="160" fill="none" stroke="#9fdcf7" stroke-opacity="0.16"/>
  <ellipse cx="258" cy="418" rx="190" ry="22" fill="#020e19" opacity="0.3"/>

  <!-- کارتریج چپ -->
  <g>
    <rect x="86" y="156" width="86" height="212" rx="30" fill="url(#fl-body)" stroke="#ffffff" stroke-opacity="0.75"/>
    <rect x="92" y="146" width="74" height="22" rx="11" fill="#cfe3f1"/>
    <rect x="92" y="356" width="74" height="20" rx="10" fill="#cfe3f1"/>

    <rect x="86" y="306" width="86" height="7" fill="#a9c9e0" opacity="0.5"/>
    <path d="M100 172v176" stroke="#ffffff" stroke-opacity="0.7" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- کارتریج میانی (بازشده) -->
  <g>
    <rect x="204" y="92" width="100" height="286" rx="34" fill="url(#fl-body)" stroke="#ffffff" stroke-opacity="0.8"/>
    <rect x="196" y="248" width="116" height="18" rx="9" fill="url(#fl-accent)"/>
    <rect x="204" y="106" width="100" height="28" rx="14" fill="#dceaf5"/>
    <rect x="204" y="336" width="100" height="28" rx="14" fill="#dceaf5"/>

    <rect x="220" y="204" width="68" height="26" rx="13" fill="#334d66" opacity="0.25"/>
    <rect x="220" y="272" width="68" height="26" rx="13" fill="#f2b23e" opacity="0.75"/>
    <rect x="220" y="304" width="68" height="20" rx="10" fill="#8ed7f5" opacity="0.55"/>
    <path d="M258 150v70M258 282v40" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>
    <text x="254" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#5f7790" letter-spacing="1">RO</text>

  <!-- کارتریج راست -->
  <g>
    <rect x="344" y="176" width="80" height="192" rx="28" fill="url(#fl-body)" stroke="#ffffff" stroke-opacity="0.7"/>

    <path d="M358 190v160" stroke="#ffffff" stroke-opacity="0.65" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- نشان اصالت -->
  <g>
    <circle cx="398" cy="92" r="40" fill="url(#fl-accent)" opacity="0.95"/>
